<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --porcelain: #EEF1F3;
    --porcelain-deep: #DCE2E7;
    --gasket: #C3CDD5;
    --ink: #1B2430;
    --ink-soft: #5D6B7A;
    --detergent: #2B54D4;
    --suds: #C9DEEC;
    --signal: #D8860B;
    --open: #16805E;
    --fault: #9AA5AE;
    --font-display: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--porcelain);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body { padding: 20px 16px 48px; }

  .shell { max-width: 560px; margin: 0 auto; }

  /* ---------- masthead ---------- */
  .room {
    font-family: var(--font-body);
    font-size: 12.5px;
    letter-spacing: 0.01em;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--gasket);
  }
  .room button {
    font: inherit;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 2px 0;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: var(--gasket);
    text-underline-offset: 3px;
    flex: none;
  }
  .room button:hover { color: var(--ink); }

  .headline {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(30px, 8.4vw, 42px);
    line-height: 1.06;
    letter-spacing: -0.005em;
    margin: 22px 0 6px;
    font-variant-numeric: tabular-nums;
  }
  .headline .dim { color: var(--gasket); }
  .subline {
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 26px;
    max-width: 44ch;
  }

  /* ---------- machine bank ---------- */
  .bank { margin-bottom: 30px; }
  .bank-label {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .machine {
    position: relative;
    background: linear-gradient(176deg, #F7F9FA 0%, var(--porcelain-deep) 100%);
    border: 1px solid var(--gasket);
    border-radius: 3px;
    padding: 16px 10px 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: center;
    box-shadow: inset 0 1px 0 #fff;
    transition: border-color .14s, transform .14s;
  }
  .machine:hover { border-color: var(--ink-soft); }
  .machine:active { transform: translateY(1px); }
  .machine:focus-visible { outline: 2px solid var(--detergent); outline-offset: 2px; }
  .machine[data-state="fault"] { background: #E7EAEC; }

  .porthole { display: block; width: 92px; height: 92px; }
  .porthole .glass { fill: var(--suds); }
  .porthole[data-state="free"] .glass { fill: #F3F7F9; }
  .porthole[data-state="fault"] .glass { fill: #DDE1E4; }
  .porthole .ring-track { fill: none; stroke: var(--gasket); stroke-width: 7; }
  .porthole .ring-fill {
    fill: none;
    stroke: var(--detergent);
    stroke-width: 7;
    stroke-linecap: butt;
    transform: rotate(-90deg);
    transform-origin: 50px 50px;
    transition: stroke-dashoffset .9s linear;
  }
  .porthole[data-state="done"] .ring-fill { stroke: var(--signal); }

  .porthole .big {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 27px;
    fill: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .porthole .unit {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.1em;
    fill: var(--ink-soft);
  }
  .porthole[data-state="free"] .big { fill: var(--open); font-size: 21px; }
  .porthole[data-state="done"] .big { fill: var(--signal); font-size: 20px; }
  .porthole[data-state="fault"] .big { fill: var(--fault); font-size: 20px; }

  @keyframes doorPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .porthole[data-state="done"] .ring-fill { animation: doorPulse 1.9s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .porthole[data-state="done"] .ring-fill { animation: none; }
    .porthole .ring-fill { transition: none; }
  }

  .m-name {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.035em;
    line-height: 1;
  }
  .m-who {
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--ink-soft);
    min-height: 2.2em;
  }
  .m-who strong { font-weight: 600; color: var(--ink); }
  .mine-flag {
    position: absolute;
    top: 0; left: 0;
    width: 0; height: 0;
    border-top: 15px solid var(--detergent);
    border-right: 15px solid transparent;
  }
  .queue-pip {
    position: absolute;
    top: 8px; right: 8px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    background: var(--ink);
    color: var(--porcelain);
    border-radius: 2px;
    padding: 1px 5px;
    letter-spacing: 0.04em;
  }

  /* ---------- alert strip ---------- */
  .alert {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--signal);
    color: #fff;
    padding: 13px 14px;
    border-radius: 3px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.35;
  }
  .alert strong { font-weight: 600; }
  .alert button {
    margin-left: auto;
    flex: none;
    font: inherit;
    font-weight: 600;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.55);
    color: #fff;
    border-radius: 2px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .alert button:hover { background: rgba(255,255,255,.3); }

  /* ---------- footer note ---------- */
  .note {
    font-size: 12px;
    line-height: 1.55;
    color: var(--ink-soft);
    border-top: 1px solid var(--gasket);
    padding-top: 14px;
    max-width: 46ch;
  }
  .sync { color: var(--gasket); }

  /* ---------- sheet / dialog ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(27,36,48,.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px;
    z-index: 40;
  }
  @media (min-width: 520px) { .backdrop { align-items: center; } }
  .sheet {
    background: var(--porcelain);
    border: 1px solid var(--gasket);
    border-radius: 4px;
    width: 100%;
    max-width: 420px;
    padding: 22px 20px 20px;
    box-shadow: 0 18px 40px rgba(27,36,48,.28);
  }
  .sheet h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 25px;
    letter-spacing: 0.015em;
    margin: 0 0 4px;
  }
  .sheet p.lede {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .field { margin-bottom: 16px; }
  .field > span {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="number"], select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    padding: 10px 11px;
    border: 1px solid var(--gasket);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--detergent); outline-offset: -1px; border-color: var(--detergent); }
  .duo { display: flex; gap: 10px; }
  .duo .field { flex: 1; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.03em;
    padding: 8px 13px;
    border: 1px solid var(--gasket);
    background: #fff;
    border-radius: 2px;
    cursor: pointer;
    color: var(--ink);
  }
  .chip[aria-pressed="true"] {
    background: var(--detergent);
    border-color: var(--detergent);
    color: #fff;
  }
  .chip:focus-visible { outline: 2px solid var(--detergent); outline-offset: 2px; }

  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .btn {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 2px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--porcelain);
    cursor: pointer;
    text-align: center;
  }
  .btn:hover { background: #111A24; }
  .btn.primary { background: var(--detergent); border-color: var(--detergent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { background: transparent; color: var(--ink); border-color: var(--gasket); }
  .btn.quiet:hover { border-color: var(--ink-soft); background: #E6EAED; }
  .btn.danger { background: transparent; color: #A33; border-color: #D9B4B4; }
  .btn:focus-visible { outline: 2px solid var(--detergent); outline-offset: 2px; }
  .btn[disabled] { opacity: .45; cursor: default; }

  .waitlist {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    background: #E5EAEE;
    border-left: 2px solid var(--gasket);
    padding: 9px 11px;
    margin: 0 0 4px;
  }
  .err { color: #A33; font-size: 13px; margin: 10px 0 0; }
</style>

<div class="shell" id="app"></div>

<script>
/* ======================================================================
   Laundry board — a shared status board for buildings whose machines
   have no sensors. Neighbours claim a machine when they start it; the
   board counts down and shows who is waiting.

   Storage: one shared key holds the room (everyone sees it), one
   personal key holds your own name.
   ====================================================================== */

const BOARD_KEY = 'laundry:board';
const ME_KEY    = 'laundry:me';
const POLL_MS   = 8000;

const CYCLES = {
  washer: [28, 40, 55, 75],
  dryer:  [30, 45, 60, 80]
};

let board = null;           // { room, machines, updatedAt }
let me    = null;           // { name }
let sheet = null;           // open dialog descriptor
let alerted = new Set();    // machine ids already announced to me
let dismissed = new Set();  // machine ids whose banner I closed
let syncNote = '';
let audioCtx = null;

/* ---------------------------------------------------------------- store */

async function readKey(key, shared) {
  try {
    const r = await window.storage.get(key, shared);
    return r && r.value ? JSON.parse(r.value) : null;
  } catch (e) {
    return null; // missing key throws
  }
}

async function writeBoard(mutate) {
  // Read-modify-write so two neighbours acting at once are less likely
  // to overwrite each other.
  const remote = await readKey(BOARD_KEY, true);
  const base = (remote && remote.updatedAt > (board ? board.updatedAt : 0)) ? remote : board;
  const next = JSON.parse(JSON.stringify(base));
  mutate(next);
  next.updatedAt = Date.now();
  board = next;
  render();
  try {
    await window.storage.set(BOARD_KEY, JSON.stringify(next), true);
    syncNote = '';
  } catch (e) {
    syncNote = "Couldn't save that — check your connection and try again.";
  }
  render();
}

async function writeMe() {
  try { await window.storage.set(ME_KEY, JSON.stringify(me), false); } catch (e) {}
}

/* ---------------------------------------------------------------- model */

function buildRoom(name, washers, dryers) {
  const machines = [];
  for (let i = 1; i <= washers; i++) machines.push(blank('w' + i, 'washer', i));
  for (let i = 1; i <= dryers;  i++) machines.push(blank('d' + i, 'dryer',  i));
  return { room: { name }, machines, updatedAt: Date.now() };
}

function blank(id, kind, n) {
  return { id, kind, n, by: null, startedAt: null, endsAt: null, minutes: null, waiting: [], fault: null };
}

// State is derived from the clock, not stored. That matters: a cycle
// still finishes correctly when nobody has the app open.
function stateOf(m) {
  if (m.fault) return 'fault';
  if (!m.by) return 'free';
  return Date.now() < m.endsAt ? 'running' : 'done';
}

const machinesOf = kind => board.machines.filter(m => m.kind === kind);
const find = id => board.machines.find(m => m.id === id);
const isMine = m => m.by && me && m.by.toLowerCase() === me.name.toLowerCase();

function msLeft(m) { return Math.max(0, m.endsAt - Date.now()); }

function fmtLeft(ms) {
  const mins = Math.ceil(ms / 60000);
  if (mins >= 60) return Math.floor(mins / 60) + 'h ' + String(mins % 60).padStart(2, '0');
  return String(mins);
}

function fmtAgo(ms) {
  const mins = Math.floor(ms / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const h = Math.floor(mins / 60);
  return h + (h === 1 ? ' hour ago' : ' hours ago');
}

const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

/* ------------------------------------------------------------- headline */

function summary() {
  const parts = [];
  for (const kind of ['washer', 'dryer']) {
    const list = machinesOf(kind);
    if (!list.length) continue;
    const free = list.filter(m => stateOf(m) === 'free');
    const done = list.filter(m => stateOf(m) === 'done');
    const running = list.filter(m => stateOf(m) === 'running');

    if (free.length) {
      parts.push(plural(free.length, kind) + ' free');
    } else if (done.length) {
      parts.push(plural(done.length, kind) + ' finished, waiting to be emptied');
    } else if (running.length) {
      const soonest = running.reduce((a, b) => (msLeft(a) < msLeft(b) ? a : b));
      parts.push('next ' + kind + ' free in ' + fmtLeft(msLeft(soonest)) + ' min');
    } else {
      parts.push('no ' + kind + ' working');
    }
  }
  return parts;
}

/* ---------------------------------------------------------------- render */

function render() {
  const app = document.getElementById('app');

  if (!board || !me) { app.innerHTML = ''; renderSheet(); return; }

  const parts = summary();
  const headline = parts.length
    ? parts.map((p, i) => cap(p) + (i < parts.length - 1 ? '.' : '.')).join('<br>')
    : 'No machines on the board yet.';

  const banks = ['washer', 'dryer'].map(kind => {
    const list = machinesOf(kind);
    if (!list.length) return '';
    return `
      <section class="bank">
        <h2 class="bank-label">${cap(kind)}s</h2>
        <div class="grid">${list.map(tile).join('')}</div>
      </section>`;
  }).join('');

  app.innerHTML = `
    <div class="room">
      <span>${esc(board.room.name)}</span>
      <button type="button" data-act="settings">You're ${esc(me.name)} · edit room</button>
    </div>

    <h1 class="headline">${headline}</h1>
    <p class="subline">Tap a machine to claim it, add time, or join the queue. Everyone in the building sees the same board.</p>

    ${banner()}
    ${banks}

    <p class="note">
      Timers run off each machine's start time, so a cycle still counts down when nobody has this open.
      Names are visible to anyone using the board — use whatever you'd write on a sign-up sheet.
      ${syncNote ? `<br><span style="color:#A33">${esc(syncNote)}</span>` : '<br><span class="sync">Refreshes every few seconds.</span>'}
    </p>`;

  app.querySelectorAll('[data-machine]').forEach(el =>
    el.addEventListener('click', () => open({ type: 'machine', id: el.dataset.machine })));
  app.querySelectorAll('[data-act="settings"]').forEach(el =>
    el.addEventListener('click', () => open({ type: 'settings' })));
  app.querySelectorAll('[data-collect]').forEach(el =>
    el.addEventListener('click', () => collect(el.dataset.collect)));

  renderSheet();
}

function tile(m) {
  const st = stateOf(m);
  const C = 2 * Math.PI * 41;
  let frac = 0, big = '', unit = '', who = '';

  if (st === 'running') {
    const total = m.endsAt - m.startedAt;
    frac = Math.min(1, Math.max(0, msLeft(m) / total));
    big = fmtLeft(msLeft(m));
    unit = 'MIN LEFT';
    who = isMine(m) ? '<strong>Your load</strong>' : esc(m.by);
  } else if (st === 'done') {
    frac = 1;
    big = 'Empty me';
    who = (isMine(m) ? '<strong>Your load</strong>' : esc(m.by)) + ' · done ' + fmtAgo(Date.now() - m.endsAt);
  } else if (st === 'fault') {
    big = 'Broken';
    who = esc(m.fault.note || 'Reported out of order');
  } else {
    big = 'Free';
    who = 'Ready to go';
  }

  const arc = st === 'running' || st === 'done'
    ? `<circle class="ring-fill" cx="50" cy="50" r="41"
         stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}"></circle>` : '';

  const label = (m.kind === 'washer' ? 'Washer ' : 'Dryer ') + m.n;
  const queue = m.waiting.length ? `<span class="queue-pip">${m.waiting.length} waiting</span>` : '';
  const flag = isMine(m) ? '<span class="mine-flag"></span>' : '';

  return `
    <button class="machine" type="button" data-machine="${m.id}" data-state="${st}"
            aria-label="${label}, ${st === 'running' ? big + ' minutes left' : big}">
      ${flag}${queue}
      <svg class="porthole" viewBox="0 0 100 100" data-state="${st}" aria-hidden="true">
        <circle class="ring-track" cx="50" cy="50" r="41"></circle>
        ${arc}
        <circle class="glass" cx="50" cy="50" r="33"></circle>
        <text class="big" x="50" y="${unit ? 50 : 55}" text-anchor="middle">${big}</text>
        ${unit ? `<text class="unit" x="50" y="64" text-anchor="middle">${unit}</text>` : ''}
      </svg>
      <span class="m-name">${label}</span>
      <span class="m-who">${who}</span>
    </button>`;
}

function banner() {
  if (!board) return '';
  const mine = board.machines.find(m =>
    stateOf(m) === 'done' && isMine(m) && !dismissed.has(m.id));
  if (mine) {
    const label = (mine.kind === 'washer' ? 'Washer ' : 'Dryer ') + mine.n;
    const q = mine.waiting.length
      ? ` ${plural(mine.waiting.length, 'neighbour')} waiting for it.` : '';
    return `<div class="alert" role="status">
      <span><strong>${label} is done.</strong>${q}</span>
      <button type="button" data-collect="${mine.id}">I emptied it</button>
    </div>`;
  }
  const turn = board.machines.find(m =>
    stateOf(m) === 'free' && m.waiting[0] && me &&
    m.waiting[0].toLowerCase() === me.name.toLowerCase());
  if (turn && !dismissed.has('turn-' + turn.id)) {
    const label = (turn.kind === 'washer' ? 'Washer ' : 'Dryer ') + turn.n;
    return `<div class="alert" role="status">
      <span><strong>${label} is free — you're next in the queue.</strong></span>
      <button type="button" data-machine="${turn.id}">Start it</button>
    </div>`;
  }
  return '';
}

/* ---------------------------------------------------------------- sheets */

function open(s) { sheet = s; render(); }
function close() { sheet = null; render(); }

function renderSheet() {
  document.querySelectorAll('.backdrop').forEach(n => n.remove());

  let html = null;
  if (!me)                       html = sheetName();
  else if (!board)               html = sheetRoom();
  else if (!sheet)               return;
  else if (sheet.type === 'machine')  html = sheetMachine(find(sheet.id));
  else if (sheet.type === 'settings') html = sheetSettings();
  if (!html) return;

  const wrap = document.createElement('div');
  wrap.className = 'backdrop';
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);

  if (me && board) {
    wrap.addEventListener('click', e => { if (e.target === wrap) close(); });
  }
  wire(wrap);
  const focusable = wrap.querySelector('input, .chip, .btn');
  if (focusable) focusable.focus();
}

function sheetName() {
  return `
    <h2>Who's doing laundry?</h2>
    <p class="lede">Your neighbours will see this name next to any machine you claim.</p>
    <label class="field"><span>First name or apartment</span>
      <input type="text" id="nm" maxlength="24" placeholder="e.g. Dana, or 3B" autocomplete="off"></label>
    <div class="actions"><button class="btn primary" data-do="save-name">Continue</button></div>
    <p class="err" id="err"></p>`;
}

function sheetRoom() {
  return `
    <h2>Set up the board</h2>
    <p class="lede">Do this once. Everyone else who opens the board joins this same room.</p>
    <label class="field"><span>Which laundry room is this?</span>
      <input type="text" id="rn" maxlength="40" placeholder="e.g. Basement, 14 Pearl St" autocomplete="off"></label>
    <div class="duo">
      <label class="field"><span>Washers</span><input type="number" id="wc" min="0" max="12" value="2"></label>
      <label class="field"><span>Dryers</span><input type="number" id="dc" min="0" max="12" value="2"></label>
    </div>
    <div class="actions"><button class="btn primary" data-do="save-room">Create board</button></div>
    <p class="err" id="err"></p>`;
}

function sheetMachine(m) {
  if (!m) return null;
  const st = stateOf(m);
  const label = (m.kind === 'washer' ? 'Washer ' : 'Dryer ') + m.n;
  const queued = me && m.waiting.some(n => n.toLowerCase() === me.name.toLowerCase());
  const q = m.waiting.length
    ? `<p class="waitlist">Queue: ${m.waiting.map(esc).join(', ')}</p>` : '';

  if (st === 'free') {
    const chips = CYCLES[m.kind].map((min, i) =>
      `<button class="chip" data-min="${min}" aria-pressed="${i === 1}">${min} min</button>`).join('');
    return `
      <h2>Start ${label}</h2>
      <p class="lede">How long is your cycle? The board counts down from now.</p>
      <div class="field"><span>Cycle length</span><div class="chips">${chips}</div></div>
      ${q}
      <div class="actions">
        <button class="btn primary" data-do="start" data-id="${m.id}">Claim it</button>
        <button class="btn quiet" data-do="fault" data-id="${m.id}">Report out of order</button>
        <button class="btn quiet" data-do="close">Cancel</button>
      </div>`;
  }

  if (st === 'fault') {
    return `
      <h2>${label} is out of order</h2>
      <p class="lede">Reported by ${esc(m.fault.by)}, ${fmtAgo(Date.now() - m.fault.at)}.</p>
      ${m.fault.note ? `<p class="waitlist">${esc(m.fault.note)}</p>` : ''}
      <div class="actions">
        <button class="btn" data-do="fixed" data-id="${m.id}">It's working again</button>
        <button class="btn quiet" data-do="close">Close</button>
      </div>`;
  }

  if (st === 'done') {
    return `
      <h2>${label} has finished</h2>
      <p class="lede">${isMine(m) ? 'This is your load' : esc(m.by) + "'s load"} — done ${fmtAgo(Date.now() - m.endsAt)}.</p>
      ${q}
      <div class="actions">
        <button class="btn primary" data-do="collect" data-id="${m.id}">${isMine(m) ? 'I emptied it' : "It's empty now"}</button>
        ${queued ? `<button class="btn quiet" data-do="unqueue" data-id="${m.id}">Leave the queue</button>`
                 : `<button class="btn quiet" data-do="queue" data-id="${m.id}">Add me to the queue</button>`}
        <button class="btn quiet" data-do="close">Close</button>
      </div>`;
  }

  // running
  const left = fmtLeft(msLeft(m));
  return `
    <h2>${label}, ${left} min left</h2>
    <p class="lede">${isMine(m) ? 'Your load' : esc(m.by) + ' started this'} · ${m.minutes} min cycle.</p>
    ${q}
    <div class="actions">
      ${isMine(m) ? `
        <button class="btn" data-do="extend" data-id="${m.id}">Add 10 minutes</button>
        <button class="btn primary" data-do="collect" data-id="${m.id}">Finished early — free it up</button>`
      : (queued
        ? `<button class="btn quiet" data-do="unqueue" data-id="${m.id}">Leave the queue</button>`
        : `<button class="btn primary" data-do="queue" data-id="${m.id}">Add me to the queue</button>`)}
      <button class="btn quiet" data-do="close">Close</button>
    </div>`;
}

function sheetSettings() {
  const w = machinesOf('washer').length, d = machinesOf('dryer').length;
  return `
    <h2>Room settings</h2>
    <p class="lede">Changing the machine count rebuilds the board for everyone. Running cycles are kept where the machine still exists.</p>
    <label class="field"><span>Your name on the board</span>
      <input type="text" id="nm2" maxlength="24" value="${esc(me.name)}"></label>
    <label class="field"><span>Room name</span>
      <input type="text" id="rn2" maxlength="40" value="${esc(board.room.name)}"></label>
    <div class="duo">
      <label class="field"><span>Washers</span><input type="number" id="wc2" min="0" max="12" value="${w}"></label>
      <label class="field"><span>Dryers</span><input type="number" id="dc2" min="0" max="12" value="${d}"></label>
    </div>
    <div class="actions">
      <button class="btn primary" data-do="save-settings">Save changes</button>
      <button class="btn quiet" data-do="close">Cancel</button>
      <button class="btn danger" data-do="clear-all">Clear every machine</button>
    </div>`;
}

/* --------------------------------------------------------------- actions */

function wire(wrap) {
  wrap.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    wrap.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
    c.setAttribute('aria-pressed', 'true');
  }));

  wrap.querySelectorAll('[data-do]').forEach(b => b.addEventListener('click', async () => {
    const id = b.dataset.id;
    const err = wrap.querySelector('#err');

    switch (b.dataset.do) {
      case 'close': return close();

      case 'save-name': {
        const v = wrap.querySelector('#nm').value.trim();
        if (!v) { if (err) err.textContent = 'Add a name so neighbours know whose load it is.'; return; }
        me = { name: v };
        await writeMe();
        unlockSound();
        return render();
      }

      case 'save-room': {
        const rn = wrap.querySelector('#rn').value.trim();
        const wc = +wrap.querySelector('#wc').value || 0;
        const dc = +wrap.querySelector('#dc').value || 0;
        if (!rn) { err.textContent = 'Give the room a name your neighbours will recognise.'; return; }
        if (wc + dc < 1) { err.textContent = 'Add at least one machine.'; return; }
        board = buildRoom(rn, Math.min(wc, 12), Math.min(dc, 12));
        try { await window.storage.set(BOARD_KEY, JSON.stringify(board), true); }
        catch (e) { syncNote = "Couldn't save the board — check your connection."; }
        return render();
      }

      case 'start': {
        const chip = wrap.querySelector('.chip[aria-pressed="true"]');
        const min = +(chip ? chip.dataset.min : 40);
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (!m || m.by) return;
          m.by = me.name;
          m.startedAt = Date.now();
          m.minutes = min;
          m.endsAt = Date.now() + min * 60000;
          m.waiting = m.waiting.filter(n => n.toLowerCase() !== me.name.toLowerCase());
          alerted.delete(m.id);
          dismissed.delete(m.id);
          dismissed.delete('turn-' + m.id);
        });
      }

      case 'extend':
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (!m) return;
          m.endsAt = Math.max(m.endsAt, Date.now()) + 10 * 60000;
          m.minutes += 10;
          alerted.delete(m.id);
          dismissed.delete(m.id);
        });

      case 'collect': close(); return collect(id);

      case 'queue':
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (m && !m.waiting.some(n => n.toLowerCase() === me.name.toLowerCase())) m.waiting.push(me.name);
        });

      case 'unqueue':
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (m) m.waiting = m.waiting.filter(n => n.toLowerCase() !== me.name.toLowerCase());
        });

      case 'fault': {
        const note = prompt("What's wrong with it? (optional)") || '';
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (m) m.fault = { by: me.name, at: Date.now(), note: note.trim().slice(0, 90) };
        });
      }

      case 'fixed':
        close();
        return writeBoard(bd => {
          const m = bd.machines.find(x => x.id === id);
          if (m) m.fault = null;
        });

      case 'save-settings': {
        const nm = wrap.querySelector('#nm2').value.trim();
        const rn = wrap.querySelector('#rn2').value.trim();
        const wc = Math.min(+wrap.querySelector('#wc2').value || 0, 12);
        const dc = Math.min(+wrap.querySelector('#dc2').value || 0, 12);
        if (nm) { me = { name: nm }; await writeMe(); }
        close();
        return writeBoard(bd => {
          if (rn) bd.room.name = rn;
          const keep = [];
          for (let i = 1; i <= wc; i++) keep.push(bd.machines.find(m => m.id === 'w' + i) || blank('w' + i, 'washer', i));
          for (let i = 1; i <= dc; i++) keep.push(bd.machines.find(m => m.id === 'd' + i) || blank('d' + i, 'dryer', i));
          bd.machines = keep;
        });
      }

      case 'clear-all':
        if (!confirm('Mark every machine free and empty all queues?')) return;
        close();
        return writeBoard(bd => {
          bd.machines = bd.machines.map(m => blank(m.id, m.kind, m.n));
        });
    }
  }));

  wrap.addEventListener('keydown', e => {
    if (e.key === 'Escape' && me && board) close();
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      const go = wrap.querySelector('.btn.primary');
      if (go) go.click();
    }
  });
}

function collect(id) {
  dismissed.add(id);
  alerted.delete(id);
  return writeBoard(bd => {
    const m = bd.machines.find(x => x.id === id);
    if (!m) return;
    const next = m.waiting;
    Object.assign(m, blank(m.id, m.kind, m.n));
    m.waiting = next;             // queue survives; the next person is up
  });
}

/* ------------------------------------------------------------ alerts */

function unlockSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {}
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) {}
  }
}

function chime() {
  if (!audioCtx) return;
  try {
    [880, 1174].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = f; o.type = 'sine';
      const t = audioCtx.currentTime + i * 0.22;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.55);
    });
  } catch (e) {}
}

function announce(text) {
  chime();
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('Laundry', { body: text });
    }
  } catch (e) {}
}

function checkAlerts() {
  if (!board || !me) return;
  for (const m of board.machines) {
    const label = (m.kind === 'washer' ? 'Washer ' : 'Dryer ') + m.n;
    if (stateOf(m) === 'done' && isMine(m) && !alerted.has(m.id)) {
      alerted.add(m.id);
      announce(label + ' has finished.');
    }
    const turnKey = 'turn-' + m.id;
    if (stateOf(m) === 'free' && m.waiting[0] &&
        m.waiting[0].toLowerCase() === me.name.toLowerCase() && !alerted.has(turnKey)) {
      alerted.add(turnKey);
      announce(label + ' is free — you\'re next.');
    }
  }
}

/* --------------------------------------------------------------- loop */

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

async function poll() {
  const remote = await readKey(BOARD_KEY, true);
  if (remote && (!board || remote.updatedAt > board.updatedAt)) {
    board = remote;
    render();
  }
}

(async function init() {
  me = await readKey(ME_KEY, false);
  board = await readKey(BOARD_KEY, true);
  if (me) unlockSound();
  render();

  setInterval(() => { if (board && me && !sheet) render(); checkAlerts(); }, 1000);
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  document.addEventListener('click', () => { if (!audioCtx) unlockSound(); }, { once: true });
})();
</script>
